<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(99,102,241,0.3)"/>
      <stop offset="100%" stop-color="rgba(99,102,241,0)"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  <!-- Subtle glow ring -->
  <circle cx="200" cy="200" r="180" fill="url(#glow)"/>
  <!-- Body/shoulders shape -->
  <ellipse cx="200" cy="310" rx="100" ry="60" fill="rgba(255,255,255,0.08)"/>
  <!-- Head circle -->
  <circle cx="200" cy="185" r="72" fill="rgba(255,255,255,0.12)"/>
  <!-- Initials -->
  <text
    x="200" y="207"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="60"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    letter-spacing="-2"
    opacity="0.95"
  >KS</text>
</svg>
